<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign in with ChatGPT</title>
  <style>
    body { margin: 0; padding: 24px; box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; color: #252642; background: #f1f1fa; font: 16px/1.6 -apple-system, "PingFang SC", sans-serif; }
    main { box-sizing: border-box; width: min(100%, 480px); padding: 36px; border: 1px solid #ddddeb; border-radius: 20px; background: white; }
    small { color: #4848aa; font-weight: 650; letter-spacing: .08em; } h1 { font-size: 27px; margin: 14px 0 8px; }
    p { color: #5e6074; } [data-result="rejected"] { color: #8a4931; }
  </style>
</head>
<body><main>
  <small>Sign in with ChatGPT</small>
  <h1 id="heading">Account authorization</h1>
  <p role="status" id="status">Verifying authorization…</p>
  <p id="return-hint">When finished, you can close this tab and return to the extension.</p>
</main><script type="module" src="callback.js"></script></body>
</html>
